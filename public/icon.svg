<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Gráfico de barras (crescendo) -->
  <rect x="80" y="300" width="60" height="132" rx="10" fill="white" opacity="0.25"/>
  <rect x="160" y="240" width="60" height="192" rx="10" fill="white" opacity="0.35"/>
  <rect x="240" y="180" width="60" height="252" rx="10" fill="white" opacity="0.45"/>
  <rect x="320" y="130" width="60" height="302" rx="10" fill="white" opacity="0.6"/>

  <!-- Linha de tendência -->
  <polyline points="110,300 190,240 270,180 350,130" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Moeda no canto superior direito -->
  <circle cx="390" cy="145" r="72" fill="url(#coin)" opacity="0.95"/>
  <circle cx="390" cy="145" r="58" fill="none" stroke="white" stroke-width="6" opacity="0.4"/>
  <text x="390" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="white">R$</text>
</svg>
