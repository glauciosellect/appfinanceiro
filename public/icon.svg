<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="60%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente moderno -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bg)"/>

  <!-- Cartão decorativo inclinado (fundo) -->
  <rect x="60" y="200" width="392" height="240" rx="24" fill="url(#card)" transform="rotate(-6 256 320)" filter="url(#shadow)"/>

  <!-- Cartão principal -->
  <rect x="72" y="210" width="368" height="210" rx="22" fill="url(#card)" filter="url(#shadow)" stroke="white" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Chip do cartão -->
  <rect x="108" y="245" width="52" height="40" rx="8" fill="#fbbf24" opacity="0.9"/>
  <line x1="108" y1="265" x2="160" y2="265" stroke="#b45309" stroke-width="2.5" opacity="0.5"/>
  <line x1="134" y1="245" x2="134" y2="285" stroke="#b45309" stroke-width="2.5" opacity="0.5"/>

  <!-- Sinal wifi / contactless -->
  <g transform="translate(176, 255)" opacity="0.85">
    <path d="M0,16 Q8,-2 16,16" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8,24 Q8,-4 24,24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Número do cartão (pontos) -->
  <g fill="white" opacity="0.7">
    <circle cx="108" cy="340" r="5"/><circle cx="122" cy="340" r="5"/><circle cx="136" cy="340" r="5"/><circle cx="150" cy="340" r="5"/>
    <circle cx="175" cy="340" r="5"/><circle cx="189" cy="340" r="5"/><circle cx="203" cy="340" r="5"/><circle cx="217" cy="340" r="5"/>
    <circle cx="242" cy="340" r="5"/><circle cx="256" cy="340" r="5"/><circle cx="270" cy="340" r="5"/><circle cx="284" cy="340" r="5"/>
  </g>
  <!-- Últimos 4 dígitos visíveis -->
  <text x="315" y="350" font-family="'Courier New', monospace" font-weight="700" font-size="28" fill="white" opacity="0.9" letter-spacing="4">5201</text>

  <!-- Seta de tendência positiva + cifrão -->
  <g transform="translate(256, 110)" filter="url(#shadow)">
    <!-- Círculo branco de fundo -->
    <circle cx="0" cy="0" r="56" fill="white" opacity="0.15"/>
    <circle cx="0" cy="0" r="44" fill="white" opacity="0.12"/>
    <!-- Seta para cima -->
    <polyline points="-22,18 -6,-10 6,4 22,-18" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="22,-18 36,-10 16,-8" fill="white"/>
  </g>

  <!-- R$ no topo esquerdo pequeno -->
  <text x="88" y="174" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="white" opacity="0.55" letter-spacing="-1">R$</text>

  <!-- Nome do app na base -->
  <text x="256" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="white" opacity="0.5" letter-spacing="2">FINANÇAS</text>
</svg>
